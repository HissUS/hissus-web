name: hissus

secrets:
  db_password:
    file: ./secrets/db_password.txt

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: hissus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hissus
      POSTGRES_USER: hissus
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    secrets:
      - db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hissus -d hissus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hissus_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hissus_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx4g -Xms4g"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hissus
      SPRING_DATASOURCE_USERNAME: hissus
    secrets:
      - db_password
    ports:
      - "8080:8080"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hissus_net

  nginx:
    image: nginx:alpine
    container_name: hissus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - hissus_net
    profiles:
      - local

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hissus_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    networks:
      - hissus_net
    profiles:
      - prod

networks:
  hissus_net:
    driver: bridge
