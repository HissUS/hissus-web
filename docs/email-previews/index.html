<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HISSUS email previews</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#1a2b3c}header{padding:24px;background:white}h1{font-size:24px}label{display:block;margin:16px 0}select{padding:12px;max-width:100%;font-size:16px}iframe{border:0;width:100%;height:100vh}</style></head><body><header><h1>HISSUS email previews</h1><p>Sample content rendered from the actual inquiry handler. No email was sent.</p><label for="preview">Choose business, recipient and language</label><select id="preview"><option value="facility-team-en.html">Factory / team / en</option><option value="facility-client-en.html">Factory / client / en</option><option value="screen-team-en.html">Windows / team / en</option><option value="screen-client-en.html">Windows / client / en</option><option value="facility-team-zh-TW.html">Factory / team / zh-TW</option><option value="facility-client-zh-TW.html">Factory / client / zh-TW</option><option value="screen-team-zh-TW.html">Windows / team / zh-TW</option><option value="screen-client-zh-TW.html">Windows / client / zh-TW</option></select></header><iframe title="Email preview" src="facility-team-en.html"></iframe><script>document.querySelector('select').addEventListener('change',event=>document.querySelector('iframe').src=event.target.value)</script></body></html>
