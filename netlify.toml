[build]
base = "frontend"
command = "pnpm build"
functions = "netlify/functions"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[dev]
command = "pnpm dev"
targetPort = 5173
port = 8888
envFiles = [".env.local"]

[functions]
node_bundler = "esbuild"

