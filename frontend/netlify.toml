[build]
command = "pnpm build"
functions = "netlify/functions"
publish = "dist"

[dev]
command = "pnpm dev"
targetPort = 5173
port = 8888
envFiles = [".env.local"]

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200