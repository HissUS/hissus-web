spring:
  application:
    name: hissus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hissus}
    username: ${SPRING_DATASOURCE_USERNAME:hissus}
    # Password read from Docker Secret file at runtime
    password: ${SPRING_DATASOURCE_PASSWORD:#{null}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    filter:
      order: 10

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.hissus: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%level","traceId":"%X{traceId}","logger":"%logger{36}","msg":"%message"}%n'
  level:
    root: WARN
    com.hissus: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
